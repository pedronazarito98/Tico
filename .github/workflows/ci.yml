name: macOS verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, and package
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run shared verification gate
        run: ./script/ci_verify.sh --package

      - name: Summarize coverage boundary
        if: always()
        run: |
          {
            echo "## Tico verification"
            echo
            echo "- Automated coverage: build, Swift tests, security regressions, and ad hoc ZIP/DMG package verification."
            echo "- Physical coverage: not exercised in CI; use the manual trackpad QA matrix."
            echo "- Distribution coverage: ad hoc only; notarization and Gatekeeper acceptance are not claimed."
          } >> "$GITHUB_STEP_SUMMARY"
