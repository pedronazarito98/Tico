name: macOS verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, and package (macOS 26)
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Report macOS and toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run shared verification gate
        run: ./script/ci_verify.sh --package

      - name: Summarize coverage boundary
        if: always()
        run: |
          {
            echo "## Tico verification"
            echo
            echo "- Runner: macos-26."
            echo "- Minimum supported system: macOS 26."
            echo "- Automated coverage when signing is configured: SwiftPM build, Xcode builds, Swift tests, XCUITest, security regressions, and Developer ID ZIP/DMG verification."
            echo "- Physical coverage: not exercised in CI; use the manual trackpad QA matrix."
            echo "- Developer ID signing requires its identity and private key on the runner. Notarization and Gatekeeper acceptance are not claimed."
          } >> "$GITHUB_STEP_SUMMARY"
